# Draws a snake (well, a wolf trail) eating the contribution graph.
# Runs daily and pushes the SVGs to the `output` branch, which README links to.
name: paw trail

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/paw-trail.svg?color_snake=#ff2e63&color_dots=#ebedf0,#ffc2d1,#ff8fab,#ff2e63,#c41d4d
            dist/paw-trail-dark.svg?palette=github-dark&color_snake=#08d9d6&color_dots=#161b22,#3b0d1f,#7a1638,#c41d4d,#ff2e63

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
